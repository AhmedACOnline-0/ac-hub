<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Hub</title>
    <style>
        /* Modern Dark Theme with Red Accents */
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent-color: #ff3333;
            --accent-hover: #cc2222;
            --text-color: #f5f5f7;
            --text-muted: #8e8e93;
            --border-color: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* LOGIN SCREEN INTERFACE */
        #login-screen {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            display: block;
        }

        #login-screen h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #login-screen h1 span {
            color: var(--accent-color);
        }

        #login-screen p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Clean Custom Login Button */
        .custom-login-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .custom-login-btn:hover {
            background-color: var(--accent-hover);
        }

        /* MAIN APP HUB INTERFACE (Hidden by default) */
        #app-screen {
            display: none; 
            width: 100vw;
            height: 100vh;
            padding: 20px;
            max-width: 800px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            background-color: #333;
        }

        .feed-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
        }

        .feed-box h2 span {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- 1. THE LOGIN SCREEN -->
    <div id="login-screen">
        <h1>AC<span>Hub</span></h1>
        <p>Connect, create, and share updates seamlessly.</p>
        
        <!-- Instant Browser Sign-In Button -->
        <button class="custom-login-btn" onclick="handleLocalSignIn()">Sign In to AC Hub</button>
    </div>

    <!-- 2. THE MAIN APP SCREEN (Appears after logging in) -->
    <div id="app-screen">
        <div class="navbar">
            <h2>AC<span>Hub</span></h2>
            <div class="user-profile">
                <img id="profile-pic" class="user-avatar" src="" alt="Avatar">
                <span id="welcome-name">User Name</span>
            </div>
        </div>

        <div class="feed-box">
            <h2>Welcome back to the <span>Feed</span>!</h2>
            <p style="margin-top: 10px; color: var(--text-muted);">You have successfully signed in to your workspace.</p>
        </div>
    </div>

    <!-- Pure Browser Logic -->
    <script>
        function handleLocalSignIn() {
            // Setup local profile details directly inside the code
            const userData = {
                name: "AhmedAC",
                picture: "https://api.dicebear.com/7.x/bottts/svg?seed=AC" // Cool default robot avatar link
            };
            
            // Apply data to UI elements
            document.getElementById('welcome-name').innerText = userData.name;
            document.getElementById('profile-pic').src = userData.picture;
            
            // Switch views completely on the client side
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            
            // Alert pop-up
            alert(`Welcome, ${userData.name}!`);
        }
    </script>
</body>
</html>
