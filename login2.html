<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Hub - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        p {
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        #googleSignInBtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #googleSignInBtn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .user-info {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            display: none;
        }

        .user-info.show {
            display: block;
        }

        .user-info img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .user-info h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .user-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 0;
        }

        #logoutBtn {
            margin-top: 15px;
            padding: 8px 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        #logoutBtn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>AC Hub</h1>
        <p>Your Social Media Platform</p>
        
        <!-- Google Sign-In SDK -->
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        
        <!-- Google Sign-In Button -->
        <button id="googleSignInBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </button>

        <!-- User Info Display (shown after sign-in) -->
        <div class="user-info" id="userInfo">
            <img id="profilePic" src="" alt="Profile">
            <h2 id="userName"></h2>
            <p id="userEmail"></p>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <script>
        // Initialize Google Sign-In
        function initializeGoogleSignIn() {
            google.accounts.id.initialize({
                client_id: '1029647062753-fpmubh8i81p2lpj0s2j46tik7s6e6c81.apps.googleusercontent.com',
                callback: handleSignInResponse
            });
        }

        // Handle sign-in response
        function handleSignInResponse(response) {
            console.log("User signed in!");
            console.log("JWT Token:", response.credential);

            // Decode the JWT token (it's Base64 encoded)
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(
                atob(base64)
                    .split('')
                    .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                    .join('')
            );

            const userData = JSON.parse(jsonPayload);
            console.log("User Data:", userData);

            // Display user info
            document.getElementById('userName').textContent = userData.name;
            document.getElementById('userEmail').textContent = userData.email;
            document.getElementById('profilePic').src = userData.picture;
            
            document.getElementById('googleSignInBtn').style.display = 'none';
            document.getElementById('userInfo').classList.add('show');

            // TODO: Send userData to your Express backend here
            // Example: fetch('/api/auth/google', { method: 'POST', body: JSON.stringify(userData) })
        }

        // Handle logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            google.accounts.id.disableAutoSelect();
            document.getElementById('googleSignInBtn').style.display = 'inline-flex';
            document.getElementById('userInfo').classList.remove('show');
            console.log("User logged out");
        });

        // Initialize on page load
        window.addEventListener('load', initializeGoogleSignIn);
    </script>
</body>
</html>
