<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Hub - Login</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent-color: #ff3333;
            --accent-hover: #cc0000;
            --text-color: #f5f5f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2c2c35;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        h1 span {
            color: var(--accent-color);
        }

        p {
            color: #8e8e93;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Centering the Google Button wrapper */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>

    <!-- Google Identity Services SDK Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="login-container">
        <h1>AC<span>Hub</span></h1>
        <p>The ultimate creator and social network.</p>
        
        <!-- Google Sign-In Configuration Dashboard -->
        <!-- Replace YOUR_GOOGLE_CLIENT_ID with your actual ID from Google Console -->
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <!-- The actual rendered Google Button -->
        <div class="button-wrapper">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_blue"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        // Callback function when user successfully signs in
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID Token received from Google:");
            console.log(response.credential);
            
            // Decode the JWT token payload to see user details
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            
            console.log("--- User Data Profile ---");
            console.log("ID: " + payload.sub);
            console.log("Name: " + payload.name);
            console.log("Email: " + payload.email);
            console.log("Profile Pic URL: " + payload.picture);
            
            alert(`Welcome back, ${payload.name}! Checking console for details.`);
            
            // Next step: fetch('/api/login', { method: 'POST', body: ... }) to send to Express + Firestore!
        }
    </script>
</body>
</html>
